<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="tic_tak_toe.css">
</head>
<body>
    <header>
        <div class="msg_container hide">
            <p id="msg">Winner</p>
            <button id="new_button">New Game</button>
        </div>
    </header>
    <main id="Main">
        <h1 id="Gname">Tic-Tac-Toe Game</h1>
        <div id="container">
            <div class="game">
                <button id="c1" class="c"></button>
                <button id="c2" class="c"></button>
                <button id="c3" class="c"></button>
                <button id="c4" class="c"></button>
                <button id="c5" class="c"></button>
                <button id="c6" class="c"></button>
                <button id="c7" class="c"></button>
                <button id="c8" class="c"></button>
                <button id="c9" class="c"></button>
            </div>
        </div>
        <button id="reset_btn">Reset Game</button>
    </main>
    <script type="module" src="tic_tak_toe.js"></script>
</body>
</html>
